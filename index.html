<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Тюлень и Рыба</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  background: linear-gradient(160deg, #0a1628, #14324a, #0d2137);
  font-family: system-ui, -apple-system, sans-serif;
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow-x: hidden;
  touch-action: manipulation;
}

/* ===== Логин ===== */
#login {
  text-align: center;
  width: 100%;
  max-width: 340px;
}
#login h1 {
  font-size: 1.9rem;
  color: #7ec8e3;
  margin-bottom: 6px;
}
#login p {
  color: #8ba3b5;
  margin-bottom: 20px;
  font-size: 0.95rem;
}
#nick {
  width: 100%;
  padding: 14px;
  font-size: 1.15rem;
  border: 2px solid #7ec8e3;
  border-radius: 14px;
  background: rgba(0,0,0,0.35);
  color: #fff;
  text-align: center;
  margin-bottom: 12px;
  outline: none;
}
.btn {
  width: 100%;
  padding: 14px;
  font-size: 1.1rem;
  background: #7ec8e3;
  color: #0a1628;
  border: none;
  border-radius: 14px;
  font-weight: 700;
  cursor: pointer;
}
.btn:active { transform: scale(0.97); }

/* ===== Игра ===== */
#game {
  display: none;
  width: 100%;
  max-width: 420px;
  text-align: center;
}
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  font-size: 0.9rem;
  color: #8ba3b5;
}
.logout {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: #ccc;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 0.85rem;
  cursor: pointer;
}
.fish-count {
  font-size: 2.4rem;
  font-weight: 800;
  color: #a8e6ff;
  text-shadow: 0 0 18px rgba(168,230,255,0.45);
  margin: 6px 0;
}
.stats {
  color: #8ba3b5;
  font-size: 0.95rem;
  margin-bottom: 12px;
}
.seal {
  font-size: 115px;
  cursor: pointer;
  display: inline-block;
  transition: transform 0.1s;
  user-select: none;
  -webkit-user-select: none;
}
.seal:active { transform: scale(0.88); }

.upgrades {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 18px;
}
.up {
  background: rgba(126,200,227,0.12);
  border: 2px solid rgba(126,200,227,0.35);
  color: #fff;
  padding: 11px 8px;
  border-radius: 12px;
  font-size: 0.88rem;
  cursor: pointer;
  text-align: center;
}
.up:disabled { opacity: 0.35; }
.up span {
  display: block;
  font-size: 0.78rem;
  color: #7ec8e3;
  margin-top: 3px;
}

/* ===== Мини-игра ===== */
#minigame {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,20,40,0.92);
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#minigame h2 {
  color: #ffd700;
  margin-bottom: 8px;
}
#minigame p {
  color: #8ba3b5;
  margin-bottom: 20px;
}
.gold-fish {
  font-size: 80px;
  cursor: pointer;
  transition: transform 0.1s;
  user-select: none;
}
.gold-fish:active { transform: scale(1.2); }
#mini-score {
  font-size: 1.8rem;
  color: #ffd700;
  margin-top: 16px;
}
#mini-timer {
  font-size: 1.3rem;
  color: #7ec8e3;
  margin-top: 8px;
}

.floating {
  position: absolute;
  font-size: 1.5rem;
  font-weight: bold;
  color: #7fdbff;
  pointer-events: none;
  animation: float 0.8s forwards;
}
@keyframes float {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-70px) scale(1.3); }
}
</style>
</head>
<body>

<!-- Логин -->
<div id="login">
  <h1>🦭 Тюлень и Рыба</h1>
  <p>Введи ник, чтобы сохранять прогресс</p>
  <input type="text" id="nick" placeholder="Твой ник" maxlength="14">
  <button class="btn" onclick="startGame()">Войти / Создать</button>
</div>

<!-- Игра -->
<div id="game">
  <div class="top-bar">
    <span id="playerName"></span>
    <button class="logout" onclick="logout()">Выйти</button>
  </div>

  <div class="fish-count" id="fish">0 🐟</div>
  <div class="stats">
    Клик: +<span id="power">1</span> · Авто: +<span id="auto">0</span>/сек
  </div>

  <div class="seal" id="seal" onclick="clickSeal(event)">🦭</div>

  <div class="upgrades">
    <button class="up" id="up1" onclick="buy(1)">Сильный укус<span id="c1">50 🐟</span></button>
    <button class="up" id="up2" onclick="buy(2)">Авто-ловля<span id="c2">200 🐟</span></button>
    <button class="up" id="up3" onclick="buy(3)">Крит-укус<span id="c3">500 🐟</span></button>
    <button class="up" id="up4" onclick="buy(4)">Быстрый тюлень<span id="c4">800 🐟</span></button>
    <button class="up" id="up5" onclick="buy(5)">Золотая рыбка<span id="c5">1500 🐟</span></button>
    <button class="up" id="up6" onclick="buy(6)">Стая тюленей<span id="c6">3000 🐟</span></button>
  </div>
</div>

<!-- Мини-игра -->
<div id="minigame">
  <h2>✨ Золотая рыба!</h2>
  <p>Тапай по рыбке как можно быстрее!</p>
  <div class="gold-fish" id="goldFish" onclick="tapGold()">🐠</div>
  <div id="mini-score">0</div>
  <div id="mini-timer">5.0</div>
</div>

<script>
// ===== Данные =====
let user = null;
let fish = 0;
let power = 1;
let auto = 0;
let crit = 0;
let speed = 1000;
let gold = 0;
let seals = 1;
let cost = [0, 50, 200, 500, 800, 1500, 3000];

let autoTimer = null;
let miniScore = 0;
let miniTime = 5;
let miniInterval = null;

// ===== Звук тюленя (Web Audio) =====
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSealSound() {
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();

  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(180, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.15);

  filter.type = 'lowpass';
  filter.frequency.value = 600;

  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.25);
}

// ===== Сохранение =====
function save() {
  if (!user) return;
  const data = { fish, power, auto, crit, speed, gold, seals, cost };
  localStorage.setItem('sealGame_' + user, JSON.stringify(data));
}

function load() {
  const raw = localStorage.getItem('sealGame_' + user);
  if (raw) {
    try {
      const d = JSON.parse(raw);
      fish = d.fish || 0;
      power = d.power || 1;
      auto = d.auto || 0;
      crit = d.crit || 0;
      speed = d.speed || 1000;
      gold = d.gold || 0;
      seals = d.seals || 1;
      cost = d.cost || [0, 50, 200, 500, 800, 1500, 3000];
    } catch(e) {}
  }
}

// ===== Вход / Выход =====
function startGame() {
  const name = document.getElementById('nick').value.trim();
  if (!name) {
    alert('Напиши ник!');
    return;
  }
  user = name;
  load();

  document.getElementById('login').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  document.getElementById('playerName').textContent = 'Игрок: ' + user;

  update();
  startAuto();
  save();
}

function logout() {
  save();
  if (autoTimer) clearInterval(autoTimer);
  user = null;
  document.getElementById('game').style.display = 'none';
  document.getElementById('login').style.display = 'block';
  document.getElementById('nick').value = '';
}

// ===== Клик по тюленю =====
function clickSeal(e) {
  playSealSound();

  let gain = power * seals;

  // Крит
  if (Math.random() * 100 < crit) {
    gain *= 2;
    showFloat(e, 'КРИТ! +' + gain);
  } else {
    showFloat(e, '+' + gain);
  }

  // Шанс золотой рыбы
  if (gold > 0 && Math.random() < 0.12) {
    startMiniGame();
  }

  fish += gain;
  update();
  save();
}

// ===== Мини-игра =====
function startMiniGame() {
  miniScore = 0;
  miniTime = 5.0;
  document.getElementById('mini-score').textContent = '0';
  document.getElementById('mini-timer').textContent = '5.0';
  document.getElementById('minigame').style.display = 'flex';

  if (miniInterval) clearInterval(miniInterval);
  miniInterval = setInterval(() => {
    miniTime -= 0.1;
    document.getElementById('mini-timer').textContent = miniTime.toFixed(1);
    if (miniTime <= 0) {
      clearInterval(miniInterval);
      endMiniGame();
    }
  }, 100);
}

function tapGold() {
  miniScore++;
  document.getElementById('mini-score').textContent = miniScore;
  // Лёгкая вибрация на телефоне
  if (navigator.vibrate) navigator.vibrate(30);
}

function endMiniGame() {
  document.getElementById('minigame').style.display = 'none';
  const bonus = miniScore * 8 * (gold + 1);
  fish += bonus;
  alert('Золотая рыба поймана!\n+' + bonus + ' 🐟');
  update();
  save();
}

// ===== Покупки =====
function buy(id) {
  if (fish < cost[id]) return;

  fish -= cost[id];

  if (id === 1) { power += 1; cost[1] = Math.floor(cost[1] * 1.48); }
  if (id === 2) { auto += 1; cost[2] = Math.floor(cost[2] * 1.55); }
  if (id === 3) { if (crit < 45) { crit += 5; cost[3] = Math.floor(cost[3] * 1.65); } }
  if (id === 4) { if (speed > 280) { speed = Math.max(280, speed - 90); cost[4] = Math.floor(cost[4] * 1.7); startAuto(); } }
  if (id === 5) { gold += 1; cost[5] = Math.floor(cost[5] * 1.85); }
  if (id === 6) { seals += 1; cost[6] = Math.floor(cost[6] * 2.0); }

  update();
  save();
}

// ===== Авто =====
function startAuto() {
  if (autoTimer) clearInterval(autoTimer);
  autoTimer = setInterval(() => {
    if (auto > 0) {
      fish += auto * seals;
      update();
      save();
    }
  }, speed);
}

// ===== Обновление UI =====
function update() {
  document.getElementById('fish').textContent = Math.floor(fish) + ' 🐟';
  document.getElementById('power').textContent = power * seals;
  document.getElementById('auto').textContent = auto * seals;

  document.getElementById('c1').textContent = cost[1] + ' 🐟';
  document.getElementById('c2').textContent = cost[2] + ' 🐟';
  document.getElementById('c3').textContent = cost[3] + ' 🐟';
  document.getElementById('c4').textContent = cost[4] + ' 🐟';
  document.getElementById('c5').textContent = cost[5] + ' 🐟';
  document.getElementById('c6').textContent = cost[6] + ' 🐟';

  document.getElementById('up1').disabled = fish < cost[1];
  document.getElementById('up2').disabled = fish < cost[2];
  document.getElementById('up3').disabled = fish < cost[3] || crit >= 45;
  document.getElementById('up4').disabled = fish < cost[4] || speed <= 280;
  document.getElementById('up5').disabled = fish < cost[5];
  document.getElementById('up6').disabled = fish < cost[6];
}

function showFloat(e, text) {
  const el = document.createElement('div');
  el.className = 'floating';
  el.textContent = text;
  el.style.left = (e.clientX - 20) + 'px';
  el.style.top = (e.clientY - 30) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 800);
}

// Автосохранение
setInterval(() => { if (user) save(); }, 2500);
</script>
</body>
  </html>
