<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Тюлень и Рыба</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  background: linear-gradient(160deg, #0a1628, #14324a, #0d2137);
  font-family: system-ui, -apple-system, sans-serif;
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow-x: hidden;
  touch-action: manipulation;
}

/* ===== Логин ===== */
#login {
  text-align: center;
  width: 100%;
  max-width: 340px;
}
#login h1 {
  font-size: 1.9rem;
  color: #7ec8e3;
  margin-bottom: 6px;
}
#login p {
  color: #8ba3b5;
  margin-bottom: 20px;
  font-size: 0.95rem;
}
#nick {
  width: 100%;
  padding: 14px;
  font-size: 1.15rem;
  border: 2px solid #7ec8e3;
  border-radius: 14px;
  background: rgba(0,0,0,0.35);
  color: #fff;
  text-align: center;
  margin-bottom: 12px;
  outline: none;
}
.btn {
  width: 100%;
  padding: 14px;
  font-size: 1.1rem;
  background: #7ec8e3;
  color: #0a1628;
  border: none;
  border-radius: 14px;
  font-weight: 700;
  cursor: pointer;
}
.btn:active { transform: scale(0.97); }

/* ===== Игра ===== */
#game {
  display: none;
  width: 100%;
  max-width: 440px;
  text-align: center;
}
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  font-size: 0.9rem;
  color: #8ba3b5;
}
.logout {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: #ccc;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 0.85rem;
  cursor: pointer;
}
.fish-count {
  font-size: 2.5rem;
  font-weight: 800;
  color: #a8e6ff;
  text-shadow: 0 0 18px rgba(168,230,255,0.45);
  margin: 6px 0;
}
.stats {
  color: #8ba3b5;
  font-size: 0.92rem;
  margin-bottom: 10px;
  line-height: 1.4;
}
.seal {
  font-size: 115px;
  cursor: pointer;
  display: inline-block;
  transition: transform 0.1s;
  user-select: none;
  -webkit-user-select: none;
  margin: 4px 0 8px;
}
.seal:active { transform: scale(0.88); }

.upgrades {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 14px;
}
.up {
  background: rgba(126,200,227,0.12);
  border: 2px solid rgba(126,200,227,0.35);
  color: #fff;
  padding: 10px 7px;
  border-radius: 12px;
  font-size: 0.84rem;
  cursor: pointer;
  text-align: center;
  line-height: 1.25;
}
.up:disabled { opacity: 0.35; cursor: default; }
.up span {
  display: block;
  font-size: 0.75rem;
  color: #7ec8e3;
  margin-top: 3px;
}

/* ===== Мини-игры ===== */
#minigame, #minigame2 {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,20,40,0.93);
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#minigame h2, #minigame2 h2 {
  color: #ffd700;
  margin-bottom: 8px;
}
#minigame p, #minigame2 p {
  color: #8ba3b5;
  margin-bottom: 18px;
  text-align: center;
}
.gold-fish {
  font-size: 80px;
  cursor: pointer;
  transition: transform 0.1s;
  user-select: none;
}
.gold-fish:active { transform: scale(1.25); }
#mini-score, #mini2-score {
  font-size: 1.8rem;
  color: #ffd700;
  margin-top: 14px;
}
#mini-timer, #mini2-timer {
  font-size: 1.3rem;
  color: #7ec8e3;
  margin-top: 6px;
}

/* Вторая мини-игра — ледяная лунка */
.ice-hole {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #b8e0f0, #4a90b8 60%, #1a3a5c);
  border: 6px solid #7ec8e3;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 64px;
  cursor: pointer;
  position: relative;
  box-shadow: 0 0 30px rgba(126,200,227,0.4);
  user-select: none;
}
.ice-hole.ready {
  animation: pulse 0.6s infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(126,200,227,0.4); }
  50% { transform: scale(1.08); box-shadow: 0 0 45px rgba(255,215,0,0.7); }
}

.floating {
  position: absolute;
  font-size: 1.45rem;
  font-weight: bold;
  color: #7fdbff;
  pointer-events: none;
  animation: float 0.85s forwards;
  z-index: 50;
}
@keyframes float {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-70px) scale(1.25); }
}
</style>
</head>
<body>

<!-- Логин -->
<div id="login">
  <h1>🦭 Тюлень и Рыба</h1>
  <p>Введи ник, чтобы сохранять прогресс</p>
  <input type="text" id="nick" placeholder="Твой ник" maxlength="14">
  <button class="btn" onclick="startGame()">Войти / Создать</button>
</div>

<!-- Игра -->
<div id="game">
  <div class="top-bar">
    <span id="playerName"></span>
    <button class="logout" onclick="logout()">Выйти</button>
  </div>

  <div class="fish-count" id="fish">0 🐟</div>
  <div class="stats">
    Клик: +<span id="power">1</span> · Авто: +<span id="auto">0</span>/сек<br>
    Крит: <span id="critChance">0</span>% · Удача: <span id="luck">0</span>%
  </div>

  <div class="seal" id="seal" onclick="clickSeal(event)">🦭</div>

  <div class="upgrades">
    <button class="up" id="up1" onclick="buy(1)">Сильный укус<span id="c1">80 🐟</span></button>
    <button class="up" id="up2" onclick="buy(2)">Авто-ловля<span id="c2">280 🐟</span></button>
    <button class="up" id="up3" onclick="buy(3)">Крит-укус<span id="c3">650 🐟</span></button>
    <button class="up" id="up4" onclick="buy(4)">Быстрый тюлень<span id="c4">1100 🐟</span></button>
    <button class="up" id="up5" onclick="buy(5)">Золотая рыбка<span id="c5">2200 🐟</span></button>
    <button class="up" id="up6" onclick="buy(6)">Стая тюленей<span id="c6">4500 🐟</span></button>
    <button class="up" id="up7" onclick="buy(7)">Рыбный магнит<span id="c7">7000 🐟</span></button>
    <button class="up" id="up8" onclick="buy(8)">Удачный укус<span id="c8">12000 🐟</span></button>
    <button class="up" id="up9" onclick="buy(9)">Ледяная лунка<span id="c9">18000 🐟</span></button>
    <button class="up" id="up10" onclick="buy(10)">Тренировка<span id="c10">25000 🐟</span></button>
  </div>
</div>

<!-- Мини-игра 1: Золотая рыба -->
<div id="minigame">
  <h2>✨ Золотая рыба!</h2>
  <p>Тапай по рыбке как можно быстрее!</p>
  <div class="gold-fish" id="goldFish" onclick="tapGold()">🐠</div>
  <div id="mini-score">0</div>
  <div id="mini-timer">5.0</div>
</div>

<!-- Мини-игра 2: Ледяная лунка -->
<div id="minigame2">
  <h2>🧊 Ледяная лунка</h2>
  <p>Жди, когда рыба клюнет, и быстро тапай!</p>
  <div class="ice-hole" id="iceHole" onclick="tapIce()">❄️</div>
  <div id="mini2-score">0</div>
  <div id="mini2-timer">12.0</div>
</div>

<script>
// ===== Данные =====
let user = null;
let fish = 0;
let power = 1;
let auto = 0;
let crit = 0;          // шанс крита %
let speed = 1000;      // интервал авто
let gold = 0;          // уровень золотой рыбки
let seals = 1;         // множитель стаи
let magnet = 0;        // бонус к авто
let luck = 0;          // шанс удачного укуса %
let ice = 0;           // уровень ледяной лунки
let train = 0;         // тренировка (множитель силы)

let cost = [0, 80, 280, 650, 1100, 2200, 4500, 7000, 12000, 18000, 25000];

let autoTimer = null;
let miniScore = 0;
let miniTime = 5;
let miniInterval = null;

// Для второй мини-игры
let iceScore = 0;
let iceTime = 12;
let iceInterval = null;
let iceReady = false;
let iceTimeout = null;

// Звук клика (положи файл seal.mp3 рядом с HTML)
const sealAudio = new Audio('seal.mp3');
sealAudio.volume = 0.7;

function playSealSound() {
  try {
    sealAudio.currentTime = 0;
    sealAudio.play().catch(() => {});
  } catch (e) {}
}

// ===== Сохранение =====
function save() {
  if (!user) return;
  const data = { fish, power, auto, crit, speed, gold, seals, magnet, luck, ice, train, cost };
  localStorage.setItem('sealGame_' + user, JSON.stringify(data));
}

function load() {
  const raw = localStorage.getItem('sealGame_' + user);
  if (raw) {
    try {
      const d = JSON.parse(raw);
      fish   = d.fish   || 0;
      power  = d.power  || 1;
      auto   = d.auto   || 0;
      crit   = d.crit   || 0;
      speed  = d.speed  || 1000;
      gold   = d.gold   || 0;
      seals  = d.seals  || 1;
      magnet = d.magnet || 0;
      luck   = d.luck   || 0;
      ice    = d.ice    || 0;
      train  = d.train  || 0;
      cost   = d.cost   || [0, 80, 280, 650, 1100, 2200, 4500, 7000, 12000, 18000, 25000];
    } catch (e) {}
  }
}

// ===== Вход / Выход =====
function startGame() {
  const name = document.getElementById('nick').value.trim();
  if (!name) {
    alert('Напиши ник!');
    return;
  }
  user = name;
  load();

  document.getElementById('login').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  document.getElementById('playerName').textContent = 'Игрок: ' + user;

  update();
  startAuto();
  save();
}

function logout() {
  save();
  if (autoTimer) clearInterval(autoTimer);
  user = null;
  document.getElementById('game').style.display = 'none';
  document.getElementById('login').style.display = 'block';
  document.getElementById('nick').value = '';
}

// ===== Клик по тюленю =====
function clickSeal(e) {
  playSealSound();

  let mult = seals * (1 + train * 0.15);
  let gain = Math.floor(power * mult);

  // Крит
  let isCrit = false;
  if (Math.random() * 100 < crit) {
    gain *= 2;
    isCrit = true;
  }

  // Удачный укус
  if (Math.random() * 100 < luck) {
    gain *= 5;
    showFloat(e, 'УДАЧА! +' + gain);
  } else if (isCrit) {
    showFloat(e, 'КРИТ! +' + gain);
  } else {
    showFloat(e, '+' + gain);
  }

  // Шанс золотой рыбы (гораздо реже)
  // Базовый шанс 3.5% + 0.8% за каждый уровень gold, максимум \~12%
  const goldChance = Math.min(0.035 + gold * 0.008, 0.12);
  if (gold > 0 && Math.random() < goldChance) {
    startMiniGame();
  }

  // Шанс ледяной лунки (ещё реже)
  if (ice > 0 && Math.random() < 0.025 + ice * 0.004) {
    startIceGame();
  }

  fish += gain;
  update();
  save();
}

// ===== Мини-игра 1: Золотая рыба =====
function startMiniGame() {
  if (document.getElementById('minigame').style.display === 'flex' ||
      document.getElementById('minigame2').style.display === 'flex') return;

  miniScore = 0;
  miniTime = 5.0;
  document.getElementById('mini-score').textContent = '0';
  document.getElementById('mini-timer').textContent = '5.0';
  document.getElementById('minigame').style.display = 'flex';

  if (miniInterval) clearInterval(miniInterval);
  miniInterval = setInterval(() => {
    miniTime -= 0.1;
    document.getElementById('mini-timer').textContent = miniTime.toFixed(1);
    if (miniTime <= 0) {
      clearInterval(miniInterval);
      endMiniGame();
    }
  }, 100);
}

function tapGold() {
  miniScore++;
  document.getElementById('mini-score').textContent = miniScore;
  if (navigator.vibrate) navigator.vibrate(25);
}

function endMiniGame() {
  document.getElementById('minigame').style.display = 'none';
  const bonus = Math.floor(miniScore * 10 * (gold + 1));
  fish += bonus;
  alert('Золотая рыба поймана!\n+' + bonus + ' 🐟');
  update();
  save();
}

// ===== Мини-игра 2: Ледяная лунка =====
function startIceGame() {
  if (document.getElementById('minigame').style.display === 'flex' ||
      document.getElementById('minigame2').style.display === 'flex') return;

  iceScore = 0;
  iceTime = 12.0;
  iceReady = false;
  document.getElementById('mini2-score').textContent = '0';
  document.getElementById('mini2-timer').textContent = '12.0';
  document.getElementById('iceHole').textContent = '❄️';
  document.getElementById('iceHole').classList.remove('ready');
  document.getElementById('minigame2').style.display = 'flex';

  if (iceInterval) clearInterval(iceInterval);
  if (iceTimeout) clearTimeout(iceTimeout);

  iceInterval = setInterval(() => {
    iceTime -= 0.1;
    document.getElementById('mini2-timer').textContent = iceTime.toFixed(1);
    if (iceTime <= 0) {
      clearInterval(iceInterval);
      endIceGame();
    }
  }, 100);

  scheduleBite();
}

function scheduleBite() {
  if (document.getElementById('minigame2').style.display !== 'flex') return;
  const delay = 1200 + Math.random() * 2800;
  iceTimeout = setTimeout(() => {
    if (document.getElementById('minigame2').style.display !== 'flex') return;
    iceReady = true;
    document.getElementById('iceHole').textContent = '🐠';
    document.getElementById('iceHole').classList.add('ready');

    // Если не успел — рыба уходит
    iceTimeout = setTimeout(() => {
      if (!iceReady) return;
      iceReady = false;
      document.getElementById('iceHole').textContent = '❄️';
      document.getElementById('iceHole').classList.remove('ready');
      scheduleBite();
    }, 900 + Math.random() * 500);
  }, delay);
}

function tapIce() {
  if (!iceReady) return;
  iceReady = false;
  iceScore++;
  document.getElementById('mini2-score').textContent = iceScore;
  document.getElementById('iceHole').textContent = '❄️';
  document.getElementById('iceHole').classList.remove('ready');
  if (navigator.vibrate) navigator.vibrate(40);
  if (iceTimeout) clearTimeout(iceTimeout);
  scheduleBite();
}

function endIceGame() {
  document.getElementById('minigame2').style.display = 'none';
  if (iceTimeout) clearTimeout(iceTimeout);
  if (iceInterval) clearInterval(iceInterval);
  const bonus = Math.floor(iceScore * 35 * (ice + 1));
  fish += bonus;
  alert('Ледяная рыбалка окончена!\nПоймано: ' + iceScore + '\n+' + bonus + ' 🐟');
  update();
  save();
}

// ===== Покупки =====
function buy(id) {
  if (fish < cost[id]) return;

  fish -= cost[id];

  if (id === 1) { // Сильный укус
    power += 1;
    cost[1] = Math.floor(cost[1] * 1.55);
  }
  if (id === 2) { // Авто
    auto += 1;
    cost[2] = Math.floor(cost[2] * 1.62);
  }
  if (id === 3) { // Крит
    if (crit < 50) {
      crit += 4;
      cost[3] = Math.floor(cost[3] * 1.70);
    }
  }
  if (id === 4) { // Скорость авто
    if (speed > 250) {
      speed = Math.max(250, speed - 80);
      cost[4] = Math.floor(cost[4] * 1.75);
      startAuto();
    }
  }
  if (id === 5) { // Золотая
    gold += 1;
    cost[5] = Math.floor(cost[5] * 1.90);
  }
  if (id === 6) { // Стая
    seals += 1;
    cost[6] = Math.floor(cost[6] * 2.05);
  }
  if (id === 7) { // Магнит
    magnet += 1;
    cost[7] = Math.floor(cost[7] * 1.85);
  }
  if (id === 8) { // Удача
    if (luck < 25) {
      luck += 3;
      cost[8] = Math.floor(cost[8] * 1.95);
    }
  }
  if (id === 9) { // Ледяная лунка
    ice += 1;
    cost[9] = Math.floor(cost[9] * 2.10);
  }
  if (id === 10) { // Тренировка
    train += 1;
    cost[10] = Math.floor(cost[10] * 2.20);
  }

  update();
  save();
}

// ===== Авто =====
function startAuto() {
  if (autoTimer) clearInterval(autoTimer);
  autoTimer = setInterval(() => {
    if (auto > 0 || magnet > 0) {
      const gain = Math.floor((auto + magnet * 2) * seals * (1 + train * 0.1));
      if (gain > 0) {
        fish += gain;
        update();
        save();
      }
    }
  }, speed);
}

// ===== Обновление UI =====
function update() {
  document.getElementById('fish').textContent = Math.floor(fish) + ' 🐟';

  const clickPower = Math.floor(power * seals * (1 + train * 0.15));
  const autoPower  = Math.floor((auto + magnet * 2) * seals * (1 + train * 0.1));

  document.getElementById('power').textContent = clickPower;
  document.getElementById('auto').textContent = autoPower;
  document.getElementById('critChance').textContent = crit;
  document.getElementById('luck').textContent = luck;

  // Цены
  for (let i = 1; i <= 10; i++) {
    document.getElementById('c' + i).textContent = cost[i] + ' 🐟';
  }

  // Доступность
  document.getElementById('up1').disabled = fish < cost[1];
  document.getElementById('up2').disabled = fish < cost[2];
  document.getElementById('up3').disabled = fish < cost[3] || crit >= 50;
  document.getElementById('up4').disabled = fish < cost[4] || speed <= 250;
  document.getElementById('up5').disabled = fish < cost[5];
  document.getElementById('up6').disabled = fish < cost[6];
  document.getElementById('up7').disabled = fish < cost[7];
  document.getElementById('up8').disabled = fish < cost[8] || luck >= 25;
  document.getElementById('up9').disabled = fish < cost[9];
  document.getElementById('up10').disabled = fish < cost[10];
}

function showFloat(e, text) {
  const el = document.createElement('div');
  el.className = 'floating';
  el.textContent = text;
  el.style.left = (e.clientX - 25) + 'px';
  el.style.top  = (e.clientY - 35) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 850);
}

// Автосохранение
setInterval(() => { if (user) save(); }, 3000);
</script>
</body>
  </html>
